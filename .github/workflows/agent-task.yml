name: Ajan Görevleri
on:
  repository_dispatch:
    types: [seo-scan, content]
  schedule:
    - cron: '0 1 * * *'   # her gece 01:00 UTC = 04:00 TR — gece vardiyesi (rakip taramasi)
  workflow_dispatch:
    inputs:
      type:
        description: 'gorev tipi (seo-scan | content)'
        required: false
        default: 'seo-scan'
      topic:
        description: 'konu (content icin)'
        required: false

permissions:
  contents: write

jobs:
  run-task:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Gorev tipini belirle
        id: task
        run: |
          if [ "${{ github.event_name }}" = "schedule" ]; then
            echo "type=seo-scan" >> "$GITHUB_OUTPUT"
            echo "topic=" >> "$GITHUB_OUTPUT"
          elif [ "${{ github.event_name }}" = "repository_dispatch" ]; then
            echo "type=${{ github.event.action }}" >> "$GITHUB_OUTPUT"
            echo "topic=${{ github.event.client_payload.topic }}" >> "$GITHUB_OUTPUT"
          else
            echo "type=${{ inputs.type }}" >> "$GITHUB_OUTPUT"
            echo "topic=${{ inputs.topic }}" >> "$GITHUB_OUTPUT"
          fi

      - name: Ajan calistir (GLM)
        env:
          GLM_API_KEY: ${{ secrets.GLM_API_KEY }}
          GLM_BASE_URL: ${{ secrets.GLM_BASE_URL }}
          GLM_MODEL: ${{ secrets.GLM_MODEL }}
          TASK_TYPE: ${{ steps.task.outputs.type }}
          TASK_TOPIC: ${{ steps.task.outputs.topic }}
        run: python scripts/agent/runner.py

      - name: Ciktilari commitla
        run: |
          git config user.name "servispilot-ajan"
          git config user.email "ajan@servispilot.com.tr"
          git add ekip/raporlar/ blog-taslaklari/ 2>/dev/null || true
          if git diff --cached --quiet; then
            echo "Cikti yok, commit atlanıyor."
          else
            git commit -m "ajan: ${{ steps.task.outputs.type }} ciktisi ($(date +%F))"
            git push
          fi
